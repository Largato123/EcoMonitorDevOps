name: EcoMonitor CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar API
        run: dotnet restore MonitoramentoEnergetico.csproj

      - name: Restaurar testes
        run: dotnet restore MonitoramentoEnergeticoAPI.Tests/MonitoramentoEnergeticoAPI.Tests.csproj

      - name: Compilar API
        run: dotnet build MonitoramentoEnergetico.csproj --no-restore --configuration Release

      - name: Executar testes
        run: dotnet test MonitoramentoEnergeticoAPI.Tests/MonitoramentoEnergeticoAPI.Tests.csproj --no-restore --configuration Release

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar metadados da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Construir e publicar imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}